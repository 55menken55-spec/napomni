# Сборка APK «Напомни» на GitHub Actions.
# Триггерится пуше изменения этого файла (или вручную из UI), чтобы обычные
# коммиты не запускали пересборку. Готовые APK и debug.keystore коммитятся
# обратно в ту же ветку, откуда запущена сборка. При падении сборки в ветку
# коммитится каталог ci-debug/ с диагностикой (логи недоступны иначе).
name: build-apk

on:
  push:
    branches: ['main', 'arena/**']
    paths: ['.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # На образах ubuntu-latest Android SDK уже установлен ($ANDROID_HOME).
      # Принимаем лицензии и ставим нужные пакеты напрямую, без сторонних actions.
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > sdk-licenses.log 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > sdk-install.log 2>&1 || true
          tail -3 sdk-install.log || true
          "$SDKM" --list_installed 2>/dev/null | grep -E "platforms|build-tools|platform-tools" || true

      - name: Ensure stable debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build and test (v1.1.1)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace test assembleDebug assembleRelease 2>&1 | tee build-output.log

      - name: Test summary
        if: always()
        run: |
          echo "=== Результаты тестов ==="
          find app/build/test-results -name "TEST-*.xml" -exec grep -h -o \
            'name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' {} \; || true

      - name: Rename artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug-v1.1.1.apk
          cp app/build/outputs/apk/release/app-release.apk app-release-v1.1.1.apk
          echo "=== SHA-256 ==="
          sha256sum app-debug-v1.1.1.apk app-release-v1.1.1.apk
          echo "=== Проверка версии и разрешений (release) ==="
          ${ANDROID_HOME}/build-tools/35.0.0/aapt2 dump badging app-release-v1.1.1.apk | grep -E "^package|uses-permission" || true

      - name: Commit artifacts back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-debug-v1.1.1.apk app-release-v1.1.1.apk debug.keystore
          git commit -m "Сборка v1.1.1: APK (debug и release) и debug.keystore [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Логи Actions недоступны из песочницы, поэтому при падении кладём
      # диагностику прямо в ветку.
      - name: Commit diagnostics on failure
        if: failure()
        run: |
          mkdir -p ci-debug
          { echo "ANDROID_HOME=$ANDROID_HOME"; echo "runner=$(uname -a)"; } > ci-debug/env.txt
          ls -la "$ANDROID_HOME" >> ci-debug/env.txt 2>&1 || true
          cp sdk-licenses.log sdk-install.log build-output.log ci-debug/ 2>/dev/null || true
          tail -100 build-output.log > ci-debug/gradle-tail.log 2>/dev/null || true
          if [ -d app/build/test-results ]; then
            mkdir -p ci-debug/test-results
            cp -r app/build/test-results/. ci-debug/test-results/ 2>/dev/null || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-debug
          git commit -m "CI: диагностика упавшей сборки [skip ci]" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
