# Сборка APK «Напомни» на GitHub Actions.
# Триггерится только при изменении этого файла (или вручную), чтобы обычные
# коммиты не запускали пересборку. Готовые APK и debug.keystore коммитятся
# обратно в ту же ветку, откуда запущена сборка.
name: build-apk

on:
  push:
    branches: ['main', 'arena/**']
    paths: ['.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure stable debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build and test (v1.1.1)
        run: ./gradlew --no-daemon --stacktrace test assembleDebug assembleRelease

      - name: Test summary
        if: always()
        run: |
          echo "=== Результаты тестов ==="
          find app/build/test-results -name "TEST-*.xml" -exec grep -h -o \
            'name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' {} \; || true

      - name: Rename artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug-v1.1.1.apk
          cp app/build/outputs/apk/release/app-release.apk app-release-v1.1.1.apk
          echo "=== SHA-256 ==="
          sha256sum app-debug-v1.1.1.apk app-release-v1.1.1.apk
          echo "=== Проверка версии и разрешений (release) ==="
          ${ANDROID_HOME}/build-tools/35.0.0/aapt2 dump badging app-release-v1.1.1.apk | grep -E "^package|uses-permission" || true

      - name: Commit artifacts back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-debug-v1.1.1.apk app-release-v1.1.1.apk debug.keystore
          git commit -m "Сборка v1.1.1: APK (debug и release) и debug.keystore [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
